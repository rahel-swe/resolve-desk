name: resolvedesk

services:
  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_DB: resolvedesk
      POSTGRES_USER: rahel
      POSTGRES_PASSWORD: resolvedesk-local-password
    ports:
      - "5432:5432"
    volumes:
      - resolvedesk_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahel -d resolvedesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: server
    pull_policy: build
    container_name: server
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5051
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in .env}
      Jwt__Key: ${RESOLVEDESK_JWT_KEY:?Set RESOLVEDESK_JWT_KEY in .env}
      Jwt__Issuer: ResolveDesk
      Jwt__Audience: ResolveDeskClient
    ports:
      - "5051:5051"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: client
    pull_policy: build
    container_name: client
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: ${CLIENT_API_BASE_URL:-http://localhost:5051}
    ports:
      - "3000:3000"

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["tools"]
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    environment:
      NUGET_PACKAGES: /root/.nuget/packages
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in .env}
      Jwt__Key: ${RESOLVEDESK_JWT_KEY:?Set RESOLVEDESK_JWT_KEY in .env}
      Jwt__Issuer: ResolveDesk
      Jwt__Audience: ResolveDeskClient
    volumes:
      - ./server:/src
      - resolvedesk_nuget_cache:/root/.nuget/packages
    command: sh -c "dotnet tool restore && dotnet restore ResolveDesk.csproj && dotnet ef database update --project ResolveDesk.csproj"

volumes:
  resolvedesk_app_pgdata:
  resolvedesk_nuget_cache:
